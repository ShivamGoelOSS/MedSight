# Source change -> checks -> security scans -> image (tagged with commit SHA) -> approved deploy.
# Deployment is GitOps: this workflow only updates the image tag in git; Argo CD,
# running inside the local kind cluster, pulls the change and rolls it out.
name: CI/CD

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/shivamgoeloss/medsight
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Helm lint and render
        run: |
          helm lint charts/medsight
          helm template medsight charts/medsight -n medsight > /dev/null

  security-scan:
    name: Dependency, secret and config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (fails on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --skip-dirs node_modules .

  build:
    name: Build, scan and push image
    needs: [verify, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (blocks the push on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"
      - name: Push image
        run: docker push "$IMAGE:${{ github.sha }}"
      - name: Summary
        run: echo "Pushed \`$IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Release to kind (approval required)
    needs: build
    if: github.ref == 'refs/heads/devops' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required reviewers on this environment make release a manual approval step.
    environment: production
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Point the chart at the new image
        run: |
          sed -i -E "s|^(  tag: ).*|\1\"${GITHUB_SHA}\"|" charts/medsight/values.yaml
          grep -n '  tag:' charts/medsight/values.yaml
      - name: Commit release (Argo CD syncs it)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: medsight ${GITHUB_SHA::7}" -m "Image: ${IMAGE}:${GITHUB_SHA}" -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Released \`${GITHUB_SHA::7}\` — Argo CD will sync within ~3 minutes" >> "$GITHUB_STEP_SUMMARY"
