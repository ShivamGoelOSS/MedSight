apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - podmonitor.yaml
  - alerts.yaml
# Grafana loads any ConfigMap with the grafana_dashboard label.
configMapGenerator:
  - name: medsight-dashboard
    namespace: medsight
    files:
      - dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
images:
  - name: medsight
    newName: medsight
    newTag: test3
