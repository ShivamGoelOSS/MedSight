{{- if .Values.monitoring.enabled }}
# Picked up by the Grafana sidecar (label grafana_dashboard) in any namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: medsight-dashboard
  labels:
    {{- include "medsight.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  medsight.json: |-
{{ .Files.Get "dashboards/medsight.json" | indent 4 }}
{{- end }}
