# Deployment (not StatefulSet): one replica, one volume, no need for stable pod identity.
{{- $securityContext := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medsight
  labels: {{- include "medsight.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 5
  # A rollout that cannot become Ready within 3 min is marked failed (alerted below).
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
  selector:
    matchLabels: {{- include "medsight.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "medsight.labels" . | nindent 8 }}
      annotations:
        # Roll the pod when non-secret config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: medsight
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Apply pending Prisma migrations before the new version starts serving.
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: medsight-config
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext: {{- toYaml $securityContext | nindent 12 }}
      containers:
        - name: medsight
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef:
                name: medsight-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: GEMINI_API_KEY
                  optional: true   # without a key the app still runs (sample mode)
          # Startup: allow up to 2 min for the first boot before liveness applies.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          # Liveness: process only. A dependency outage should not restart the pod.
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: database reachable, otherwise stop sending traffic here.
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml $securityContext | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: medsight-data
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
