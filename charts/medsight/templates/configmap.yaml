apiVersion: v1
kind: ConfigMap
metadata:
  name: medsight-config
  labels: {{- include "medsight.labels" . | nindent 4 }}
data:
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  STORAGE_DIR: {{ .Values.config.storageDir | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  OTEL_SERVICE_NAME: medsight
